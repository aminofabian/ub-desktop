[package]
name = "kiosk-desktop"
version = "0.0.1"
description = "Palmart for desktop — thin Tauri shell over Spring Boot + MariaDB."
authors = ["Palmart"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kiosk_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Refuse to start a second copy of the app: double-launch previously died on
# the fixed 5050/33306 ports with an invisible error. The plugin forwards the
# second launch to the running instance and focuses its window instead.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
# Used for generating a base64-encoded 256-bit payment encryption key
# (see `CredentialEncryptionService`).
base64 = "0.22.1"
# `dirs` exposes the per-OS app-data dir (Library/Application Support on macOS,
# %APPDATA% on Windows, $XDG_DATA_HOME on Linux). Avoids a bespoke matcher.
dirs = "5"
# `ureq` is a tiny blocking HTTP client (no async, no TLS by default) — exactly
# what the supervisor needs to poll /actuator/health without dragging in tokio.
ureq = { version = "2", default-features = false }
# rand for the per-install MariaDB root + ub_local passwords (see §7).
rand = "0.8"
# `dunce` strips the Windows `\\?\` extended-length prefix that
# `Path::canonicalize()` produces; the JVM's nested-jar loader rejects
# `\\?\`-prefixed paths with ClassNotFoundException in JarLauncher.
dunce = "1"

[target.'cfg(unix)'.dependencies]
# SIGTERM the JVM child on shutdown so the actuator gets a clean signal —
# `child.kill()` is SIGKILL, which leaves the schema_history table marked as
# half-applied if a migration was in flight.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Native MessageBox so startup failures are visible on Windows — with
# `windows_subsystem = "windows"` there is no console, so `eprintln!` goes
# nowhere and a dead app looks like "the installer did nothing".
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
